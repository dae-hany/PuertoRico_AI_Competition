# Runs the test suite on every push and pull request, on Linux and Windows,
# with the oldest and newest supported Python. The badge in README.md shows
# the result of the latest run on main.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: "Install (no torch: the PPO tests skip without it)"
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-github-actions-annotate-failures
      - name: Test
        # the annotate plugin reports each failed test (name, file, line,
        # message) as a check annotation on the commit, so a failure can be
        # read from the Checks tab (and the public API) without opening logs
        run: python -m pytest -q --durations=10
